# Plate recognition fine-tuning config for PP-OCRv6_small_rec.
#
# Base: PaddleOCR/configs/rec/PP-OCRv6/PP-OCRv6_small_rec.yml (upstream, unchanged
# architecture -- the pretrained head must keep its exact shape).
# Dataset: crop_img built by code/make_plate_rec_dataset.py from CCPD2019.
# Character dict: PaddleOCR/ppocr/utils/dict/ppocrv6_dict.txt (18708 chars) so the
# CTC head stays 18710 = the pretrained size (no random head, no shape warnings).
#
# code/train_ocr.py copies this file, applies its CLI overrides and passes the
# result to PaddleOCR/tools/train.py as -c, so the values below are defaults.
# Paths are absolute on purpose: the trainer runs with cwd=PaddleOCR/.

Global:
  model_name: PP-OCRv6_small_rec
  debug: false
  use_gpu: true
  epoch_num: 30
  log_smooth_window: 20
  print_batch_step: 20
  save_model_dir: E:/YOLO-Paddle-ANPR/code/output_plate
  save_epoch_step: 5
  eval_batch_step: [0, 500]
  cal_metric_during_train: true
  pretrained_model: E:/YOLO-Paddle-ANPR/PP-OCRv6_small_rec_pretrained.pdparams
  checkpoints:
  save_inference_dir:
  use_visualdl: false
  infer_img: E:/YOLO-Paddle-ANPR/image.png
  character_dict_path: E:/YOLO-Paddle-ANPR/rec_data_plate/dict.txt
  max_text_length: &max_text_length 25
  infer_mode: false
  use_space_char: true
  distributed: false
  save_res_path: E:/YOLO-Paddle-ANPR/code/output_plate/predicts_ppocrv6_small.txt
  d2s_train_image_shape: [3, 48, 320]


Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.0005
    warmup_epoch: 2
  regularizer:
    name: L2
    factor: 3.0e-05


Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform:
  Backbone:
    name: PPLCNetV4
    model_size: small
  Head:
    name: MultiHead
    head_list:
      - CTCHead:
          Neck:
            name: lightsvtr
            dims: 120
            depth: 2
            mlp_ratio: 2.0
            local_kernel: 7
          Head:
            fc_decay: 0.00001
      - NRTRHead:
          nrtr_dim: 384
          max_text_length: *max_text_length

Loss:
  name: MultiLoss
  loss_config_list:
    - CTCLoss:
    - NRTRLoss:

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc

Train:
  dataset:
    name: MultiScaleDataSet
    ds_width: false
    data_dir: E:/YOLO-Paddle-ANPR/rec_data_plate
    ext_op_transform_idx: 1
    label_file_list:
    - E:/YOLO-Paddle-ANPR/rec_data_plate/train.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - RecConAug:
        prob: 0.5
        ext_data_num: 2
        image_shape: [48, 320, 3]
        max_text_length: *max_text_length
    - RecAug:
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  sampler:
    name: MultiScaleSampler
    scales: [[320, 32], [320, 48], [320, 64]]
    first_bs: &bs 64
    fix_bs: false
    divided_factor: [8, 16]
    is_training: True
  loader:
    shuffle: true
    batch_size_per_card: *bs
    drop_last: true
    num_workers: 4

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: E:/YOLO-Paddle-ANPR/rec_data_plate
    label_file_list:
    - E:/YOLO-Paddle-ANPR/rec_data_plate/val.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - RecResizeImg:
        image_shape: [3, 48, 320]
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 64
    num_workers: 2
